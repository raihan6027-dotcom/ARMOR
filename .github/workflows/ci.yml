name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - name: Pasang dependensi
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Ruff (ml)
        run: |
          ruff check --config pyproject.toml ../ml
          ruff format --config pyproject.toml --check ../ml
      - name: Pytest (backend)
        env:
          JWT_SECRET: ci-test-secret
        run: pytest -q
      - name: Pytest (ml)
        run: |
          pip install -r ../ml/requirements.txt
          pytest -q ../ml -p no:cacheprovider
