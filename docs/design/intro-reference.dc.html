<style>
body{margin:0;background:#06142A;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#EAF4FF}
a{color:#9BE3FB}a:hover{color:#EAF4FF}
.mask-logo{-webkit-mask-image:url(/armor-mark.png);mask-image:url(/armor-mark.png);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.sheen{background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 62%);background-size:260% 100%;background-position:160% 0;animation:armorSheen 3.4s ease-in-out infinite}
.sheen-once{background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 62%);background-size:260% 100%;background-position:160% 0;animation:armorSheenOnce 1s ease-in-out .8s both}
.spin-in{animation:armorSpinIn 1.2s cubic-bezier(.2,.8,.2,1) both}
.tilt{animation:armorTilt 5s ease-in-out infinite alternate}
.ground{animation:armorGround 5s ease-in-out infinite alternate}
.ring{animation:armorRing 1.8s ease-out infinite}
.ring-late{animation:armorRing 1.8s ease-out .9s infinite}
.rise{animation:armorRise .7s cubic-bezier(.2,.8,.2,1) both}
.slogan{animation:armorSlogan 1.2s cubic-bezier(.2,.8,.2,1) both}
.flash{animation:armorFlash 1.2s linear both}
.scene-in{animation:armorSceneIn .7s cubic-bezier(.2,.8,.2,1) both}
.beam{animation:armorSweep 1.4s ease-in-out infinite alternate}
.pop{transform-box:fill-box;transform-origin:center;animation:armorPop .35s ease-out both}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:armorDraw 1.4s ease-out forwards}
.pulse{animation:armorPulse 1s ease-in-out infinite}
.stamp{animation:armorStamp .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes armorSheen{0%{background-position:160% 0}55%{background-position:-60% 0}100%{background-position:-60% 0}}
@keyframes armorSheenOnce{from{background-position:160% 0}to{background-position:-60% 0}}
@keyframes armorSpinIn{0%{opacity:0;transform:rotateY(-110deg) scale(.4);filter:blur(8px)}70%{opacity:1;transform:rotateY(14deg) scale(1.05);filter:blur(0)}100%{opacity:1;transform:rotateY(0) scale(1);filter:blur(0)}}
@keyframes armorTilt{0%{transform:rotateY(-26deg) rotateX(6deg) translateY(0)}50%{transform:rotateY(0deg) rotateX(-4deg) translateY(-10px)}100%{transform:rotateY(26deg) rotateX(6deg) translateY(0)}}
@keyframes armorGround{0%{transform:scaleX(1);opacity:.55}50%{transform:scaleX(.78);opacity:.3}100%{transform:scaleX(1);opacity:.55}}
@keyframes armorRing{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.9);opacity:0}}
@keyframes armorRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes armorSlogan{0%{opacity:0;transform:scale(2.1);filter:blur(16px)}26%{opacity:1;transform:scale(1);filter:blur(0)}82%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:0;transform:scale(.9);filter:blur(4px)}}
@keyframes armorFlash{0%,24%{opacity:0}28%{opacity:.18}46%,100%{opacity:0}}
@keyframes armorSceneIn{from{opacity:0;transform:scale(1.12);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes armorSweep{from{transform:translateY(0)}to{transform:translateY(296px)}}
@keyframes armorPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes armorDraw{to{stroke-dashoffset:0}}
@keyframes armorPulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes armorStamp{0%{opacity:0;transform:scale(1.6)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sheen,.sheen-once,.spin-in,.tilt,.ground,.ring,.ring-late,.rise,.slogan,.flash,.scene-in,.beam,.pop,.draw,.pulse,.stamp{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","options":["auto","logo","slogan","scan","done"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'logo', slogan: 0, step: 0 };
    this.timers = [];
  }
  componentDidMount() { this.start(); }
  componentDidUpdate(prev) { if (prev.phase !== this.props.phase) this.start(); }
  componentWillUnmount() { this.clear(); }
  clear() { this.timers.forEach(function (t) { clearTimeout(t); }); this.timers = []; }
  at(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  start() {
    this.clear();
    var fixed = this.props.phase && this.props.phase !== 'auto' ? this.props.phase : null;
    var reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (fixed) { this.setState({ phase: fixed, slogan: 0, step: 4 }); return; }
    if (reduce) { this.setState({ phase: 'done', slogan: 2, step: 4 }); return; }
    var self = this;
    this.setState({ phase: 'logo', slogan: 0, step: 0 });
    this.at(2000, function () { self.setState({ phase: 'slogan', slogan: 0 }); });
    this.at(3200, function () { self.setState({ slogan: 1 }); });
    this.at(4400, function () { self.setState({ slogan: 2 }); });
    this.at(5650, function () { self.setState({ phase: 'scan', step: 0 }); });
    this.at(6700, function () { self.setState({ step: 1 }); });
    this.at(7500, function () { self.setState({ step: 2 }); });
    this.at(8300, function () { self.setState({ step: 3 }); });
    this.at(8900, function () { self.setState({ step: 4 }); });
    this.at(10400, function () { self.setState({ phase: 'done' }); });
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var step = st.step;
    var labels = ['Mendeteksi wajah', 'Mencocokkan wajah terdaftar', 'Memeriksa izin pemilik'];
    var verified = step >= 4;
    return {
      isLogo: st.phase === 'logo',
      isSlogan: st.phase === 'slogan',
      isScan: st.phase === 'scan',
      isDone: st.phase === 'done',
      showSkip: st.phase === 'logo' || st.phase === 'slogan' || st.phase === 'scan',
      s0: st.slogan === 0,
      s1: st.slogan === 1,
      s2: st.slogan === 2,
      rows: labels.map(function (label, i) { return { label: label, done: step > i, active: step === i, pending: step < i }; }),
      verified: verified,
      scanning: !verified,
      bracketColor: verified ? '#5FE3B1' : '#4FB8F5',
      skip: function () { self.clear(); self.setState({ phase: 'done', slogan: 2, step: 4 }); },
      replay: function () { self.clear(); self.setState({ phase: 'reset' }); self.at(40, function () { self.start(); }); }
    };
  }
}
</script>
